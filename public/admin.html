<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ניהול - חנות הסקוושים של טליה, גפן ותהל</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-page">
    <header class="hero hero-admin">
      <h1>מסך ניהול מוצרים</h1>
      <p>הוספה, עדכון ומחיקה של צעצועים</p>
      <a class="admin-link" href="/">חזרה לחנות</a>
    </header>

    <main class="container">
      <section class="admin-card">
        <h2>התחברות מנהל</h2>
        <div class="row">
          <input id="admin-key" type="password" placeholder="מפתח מנהל (ברירת מחדל: 1234)" />
          <button id="save-key">שמור מפתח</button>
        </div>
      </section>

      <section class="admin-card">
        <h2>הגדרות הזמנה</h2>
        <p class="muted">כל ההזמנות מהחנות יישלחו למספר הזה בוואטסאפ.</p>
        <div class="row stack-mobile">
          <input id="whatsapp-phone" placeholder="מספר וואטסאפ לדוגמה: 972501234567" />
          <button id="save-settings">שמור מספר וואטסאפ</button>
        </div>
      </section>

      <section class="admin-card">
        <h2>ניהול קטגוריות</h2>
        <div class="row stack-mobile">
          <input id="new-category" placeholder="שם קטגוריה חדשה" />
          <button id="add-category-btn" type="button">הוסף קטגוריה</button>
        </div>
        <div id="categories-list" class="categories-list"></div>
      </section>

      <section class="admin-card">
        <h2>הוספת מוצר חדש</h2>
        <form id="add-form" class="form-grid">
          <input id="name" required placeholder="שם הצעצוע" />
          <input id="price" required type="number" min="0" step="0.1" placeholder="מחיר" />
          <input id="stock" required type="number" min="0" step="1" value="1" placeholder="מלאי" />
          <textarea id="description" placeholder="תיאור קצר"></textarea>
          <select id="category"></select>
          <div class="badges-picker">
            <span class="muted small">תגיות:</span>
            <label class="badge-checkbox"><input type="checkbox" name="badge" value="new" /> חדש</label>
            <label class="badge-checkbox"><input type="checkbox" name="badge" value="best" /> הכי נמכר</label>
            <label class="badge-checkbox"><input type="checkbox" name="badge" value="sale" /> מבצע</label>
          </div>
          <input id="image" type="file" accept="image/*" />
          <button type="submit">הוסף מוצר</button>
        </form>
      </section>

      <section class="admin-card">
        <h2>מוצרים קיימים</h2>
        <div id="admin-products" class="admin-products"></div>
      </section>
    </main>

    <script src="/admin.js"></script>
  </body>
</html>
