<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>חנות הסקוושים של טליה, גפן ותהל</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="shop-page">
    <header class="hero shop-hero">
      <div class="hero-top">
        <div>
          <h1>חנות הסקוושים של טליה, גפן ותהל</h1>
          <p>סקוושים מכל הסוגים</p>
        </div>
      </div>
    </header>

    <main class="container">
      <section id="hero-carousel" class="hero-carousel hidden">
        <button id="carousel-next" class="carousel-nav next" type="button">‹</button>
        <button id="carousel-prev" class="carousel-nav prev" type="button">›</button>
        <div id="carousel-track" class="carousel-track"></div>
        <div id="carousel-dots" class="carousel-dots"></div>
      </section>

      <section class="products-area">
        <button id="toggle-products-btn" class="toggle-products-btn" type="button">הצג את כל המוצרים</button>
        <div id="products-content" class="products-content hidden">
          <section id="categories-menu" class="categories-menu hidden"></section>
          <section id="products-sections"></section>
          <p id="empty-state" class="empty-state hidden">כרגע אין מוצרים להצגה.</p>
        </div>
      </section>
    </main>

    <button id="cart-dock" class="cart-dock" type="button">
      <span id="cart-count" class="cart-dock-count">0 פריטים</span>
      <strong id="cart-total" class="cart-dock-total">0.00 ₪</strong>
      <span class="cart-dock-action">פתח סל</span>
    </button>

    <section id="cart-sheet" class="cart-sheet hidden" aria-hidden="true">
      <div id="cart-backdrop" class="cart-backdrop"></div>
      <div class="cart-sheet-panel">
        <div class="cart-header">
          <h2>הסל שלי</h2>
          <button id="close-cart-btn" class="cart-close-btn" type="button">סגור</button>
        </div>
        <div id="cart-items" class="cart-items">
          <p class="muted">הסל שלך ריק כרגע.</p>
        </div>
        <div class="cart-footer">
          <div class="cart-total-row">
            <span>סה"כ</span>
            <strong id="sheet-cart-total">0.00 ₪</strong>
          </div>
          <button id="checkout-btn" class="checkout-btn" disabled>שלח הזמנה בוואטסאפ</button>
          <p id="checkout-note" class="muted small"></p>
        </div>
      </div>
    </section>

    <canvas id="confetti-canvas"></canvas>

    <script src="/app.js"></script>
  </body>
</html>
